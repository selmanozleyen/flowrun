[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "flowrun"
version = "0.0.0"
description = "Train flow-matching models on single-cell perturbation data, from reusable steps"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "anndata>=0.12",
  "dask[array]",
  "fast-array-utils",
  "hydra-core>=1.3,<1.4",    # 1.4 pre-releases break hydra-optuna-sweeper
  "hydra-joblib-launcher",   # grids as parallel local processes (hydra/launcher=joblib)
  "hydra-optuna-sweeper",
  "hydra-submitit-launcher",
  "numpy",
  "omegaconf",
  "scanpy>=1.10",
  "scikit-learn",
  "sckitflow[torch]",
  "torch",                   # direct, so the accelerator sources below apply
  "wandb",
  "zarr>=3",
  "zarrs",
]
# Accelerator selectors: torch from the matching PyTorch index and, on CUDA, cupy of the same major.
# The V100s in gpu_p need cu126; CUDA 13 torch has no kernels for them.
optional-dependencies.cpu = [ "torch" ]
optional-dependencies.cu126 = [ "sckitflow[cupy-cuda12]", "torch" ]
optional-dependencies.cu130 = [ "sckitflow[cupy-cuda13]", "torch" ]
optional-dependencies.sweep = []  # the sweepers are core dependencies; kept so `--extra sweep` still installs
optional-dependencies.test = [
  "pytest",
  "pytest-xdist>=3",
]
scripts.flowrun-fit-cfm = "flowrun.fit_cfm:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/flowrun" ]

[tool.uv]
sources.sckitflow = { git = "https://github.com/theislab/sckitflow", branch = "main" }
conflicts = [ [ { extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" } ] ]
sources.torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
index = [
  { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
  { name = "pytorch-cu126", url = "https://download.pytorch.org/whl/cu126", explicit = true },
  { name = "pytorch-cu130", url = "https://download.pytorch.org/whl/cu130", explicit = true },
]

[tool.ruff]
line-length = 120
src = [ "src" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib" ]
ini_options.markers = [ "slow: runs a subprocess training job (deselect with -m 'not slow')" ]
