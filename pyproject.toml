[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "flowrun"
version = "0.0.0"
description = "Train flow-matching models on single-cell perturbation data, from reusable steps"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "anndata>=0.12",
  "dask[array]",
  "fast-array-utils",
  "hydra-core>=1.3,<1.4",    # 1.4 pre-releases break hydra-optuna-sweeper
  "hydra-joblib-launcher",   # grids as parallel local processes (hydra/launcher=joblib)
  "hydra-optuna-sweeper",
  "hydra-submitit-launcher",
  "numpy",
  "omegaconf",
  "scanpy>=1.10",
  "scikit-learn",
  "sckitflow[torch]",
  "torch",                   # direct, so the cu126 source below applies
  "wandb",
  "zarr>=3",
  "zarrs",
]
optional-dependencies.sweep = []  # the sweepers are core dependencies; kept so `--extra sweep` still installs
optional-dependencies.test = [
  "pytest",
  "pytest-xdist>=3",
]
scripts.flowrun-fit-cfm = "flowrun.fit_cfm:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/flowrun" ]

[tool.uv]
sources.sckitflow = { git = "https://github.com/theislab/sckitflow", branch = "main" }
# CUDA 12.6 wheels on Linux: the default (CUDA 13) wheels have no kernels for the V100s in gpu_p.
sources.torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
index = [ { name = "pytorch-cu126", url = "https://download.pytorch.org/whl/cu126", explicit = true } ]

[tool.ruff]
line-length = 120
src = [ "src" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib" ]
ini_options.markers = [ "slow: runs a subprocess training job (deselect with -m 'not slow')" ]
