# @package _global_
# One trial of the panel sweep, small, to check the Optuna + submitit wiring before a real launch:
#   flowrun-fit-cfm -m +experiment=panel_sweep_smoke
defaults:
  - panel_sweep

hydra:
  sweep:
    dir: ${oc.env:FLOWRUN_SWEEP_DIR,multirun}/panel_sweep_smoke/${now:%Y-%m-%d_%H-%M-%S}
    subdir: trial_${hydra.job.num}
  sweeper:
    n_trials: 1
    n_jobs: 1

datamodule:
  n_train_steps: 20
inference:
  n_steps: 3
  n_samples: 8
trainer:
  max_epochs: 1
run:
  allow_overwrite: true
