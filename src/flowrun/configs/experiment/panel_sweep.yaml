# @package _global_
# Panel imputation sweep (ported from theislab/sckitflow#202): 30 Optuna random draws over (input data x fused-GW
# coupling), one SLURM job per trial via submitit. Needs the `sweep` extra (`uv sync --extra sweep`) and stable
# hydra-core 1.3.x (1.4 pre-releases break the Optuna sweeper at composition). See docs/sweeps.md.
#   flowrun-fit-cfm -m +experiment=panel_sweep
# The data and sweep paths below are the Helmholtz ones, and so is the launcher; override them for another cluster.
defaults:
  - panel
  - override /hydra/launcher: helmholtz      # SLURM settings in configs/hydra/launcher/helmholtz.yaml
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: random   # do not add a manual `sampler:` block: it fights this override

hydra:
  job:
    chdir: false
  sweep:
    dir: /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/sweeps
  sweeper:
    direction: minimize       # fit_cfm returns the monitored metric (callbacks.model_checkpoint.monitor)
    n_jobs: 30
    n_trials: 30
    params:
      paths.target_adata: >-
        choice(
        /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/adata_concat_seed42/adata_concat.h5ad,
        /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/adata_concat_seed43/adata_concat.h5ad,
        /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/adata_concat_seed44/adata_concat.h5ad,
        /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/adata_concat_seed45/adata_concat.h5ad,
        /lustre/groups/ml01/workspace/lorenzo.consoli/projects/CITEseq_Imputation_Cambridge/data/out/adata_concat_seed46/adata_concat.h5ad
        )
      coupling.epsilon: choice(0.5, 1.0, 2.0)
      coupling.alpha: choice(0.25, 0.5, 0.75)
      coupling.scale_cost: choice(mean, median)

# Every writer under the trial's own output directory.
save:
  run_dir: ${hydra:runtime.output_dir}/save
callbacks:
  early_stopping:
    patience: 10
  model_checkpoint:
    dirpath: ${hydra:runtime.output_dir}/checkpoints
trainer:
  default_root_dir: ${hydra:runtime.output_dir}/logs
  max_epochs: 30
  enable_progress_bar: false
loggers:
  wandb:
    save_dir: ${hydra:runtime.output_dir}/logs/wandb
    name: cfm-panel-trial-${hydra:job.num}
    offline: true
    init_kwargs:
      group: panel-adata-coupling-sweep
      job_type: random_search
      tags: [panel, adata-sweep, coupling-sweep, "trial_${hydra:job.num}"]
  csv:
    save_dir: ${hydra:runtime.output_dir}/logs/csv
    name: cfm-panel-trial-${hydra:job.num}
run:
  allow_overwrite: false
