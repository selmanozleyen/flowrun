# @package _global_
# CellFlow, scaled down to check the wiring in a few minutes on CPU:
#   flowrun-fit-cfm +experiment=cellflow_smoke paths.target_adata=/path/to/data.zarr paths.out_dir=runs/<name>
defaults:
  - cellflow

preprocessing:
  pca: 20
  n_hvg: null

module:
  time_features: {n_time_features: 32}
  time_encoder: {output_dim: 64}
  state_encoder: {output_dim: 64, mlp: {hidden_dims: [128]}}
  field_decoder: {hidden_dims: [128, 128]}
  condition_encoder:
    output_dim: 32
    pooling: {num_heads: 2, qkv_dim: 16}
    categorical_input_layers:
      drug: {output_dim: 32, mlp: {hidden_dims: [64]}}
      cell_line: {output_dim: 32, mlp: {hidden_dims: [64]}}


inference:
  n_steps: 10

datamodule:
  batch_size: 128
  n_train_steps: 200

trainer:
  max_steps: 200
  accelerator: cpu
