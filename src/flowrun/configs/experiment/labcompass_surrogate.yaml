# @package _global_
# LabCompass forward surrogate: cells (z-scored markers in X) generated from noise given the encoded design.
# Data and split come from `flowrun-labcompass prepare`:
#   flowrun-fit-cfm +experiment=labcompass_surrogate paths.target_adata=<out>/cells.zarr paths.out_dir=runs/surrogate
# `flowrun-labcompass guide` loads the model from `runs/surrogate/save` and refuses a run that re-split
# (splitter.overwrite=true): the split `prepare` wrote is what keeps the target recipe out of training.
splitter:
  source_key: null
  group_keys: []

datamanager:
  target_sample_rep: null
  continuous_conditions: [design]

probability_path:
  type: probability_path.linear
  sigma: 0.0           # required by guidance: its flow map follows a deterministic path

training:
  generate_from_noise: true

inference:
  generate_from_noise: true
  n_steps: 20
  n_samples: 1          # cells generated per observed cell at evaluation; `guide --n-cells` sets its own per design

module:
  condition_encoder:
    output_dim: 128
    continuous_input_layers:
      design: {output_dim: 128, mlp: {hidden_dims: [256, 256]}}
    pooling: {type: nn.pooling.mean}

datamodule:
  batch_size: 1024
  n_train_steps: 1000

trainer:
  max_epochs: 20

# No gradient accumulation: fit_cfm's schedule starts at epoch 5000, past max_epochs.
