# @package _global_
# The flow_cyto_panel_alignment experiment at toy size, for checking the wiring in seconds on CPU:
#   flowrun-fit-cfm +experiment=flow_cyto_panel_alignment_smoke paths.out_dir=runs/<name>
defaults:
  - flow_cyto_panel_alignment

module:
  time_features: {n_time_features: 16}
  time_encoder: {output_dim: 4, mlp: {hidden_dims: [8]}}
  state_encoder: {output_dim: 4, mlp: {hidden_dims: [8]}}
  field_decoder: {hidden_dims: [8, 8]}
  source_encoder: {output_dim: 4, mlp: {hidden_dims: [8]}}


coupling:
  scale_cost: mean
  epsilon: 0.1
  max_iter: 20
  tol: 1.0e-3

datamodule:
  n_train_steps: 5
  batch_size: 16

inference:
  n_steps: 3
  n_samples: 8

trainer:
  accelerator: cpu
  fast_dev_run: true
  enable_progress_bar: false
