# @package _global_
# Flow cytometry panel alignment (ported from theislab/sckitflow#202): map cells measured on an old marker panel onto a
# new one. Fused Gromov-Wasserstein matching (a shared linear term on the markers both panels measure, a quadratic
# term per panel), `resnet1d` conditioning, and a source encoder: the flow generates new-panel cells from noise,
# conditioned on the encoded old-panel cell.
#   flowrun-fit-cfm +experiment=flow_cyto_panel_alignment paths.out_dir=runs/<name>
# The inputs are the two panels as prepared by `python -m flowrun.panels` (markers renamed for synonyms, labelled,
# the steps in `uns["panels"]`). The state is each panel's `layers["logicle_trans"]`, as is; the coupling compares
# the markers both panels measure (by name) and each panel's own markers. The split is drawn per cell
# (target panel only; the old panel is every split's source) and written once per seed to obs["split_<seed>"].

paths:
  target_adata: ???   # [old panel zarr, new panel zarr]: a project supplies them (e.g. theislab/flow-cytometry-imputation)

splitter:
  type: random_cells
  split_key: split_${run.splitter_seed}
  source_key: dataset
  source_value: old panel
  group_keys: [dataset]
  test_fraction: 0.2
  val_fraction: 0.1

datamanager:
  target_sample_rep: layers/logicle_trans   # the new panel's markers
  source_sample_rep: layers/logicle_trans   # the old panel's own markers, read by the source encoder
  categorical_conditions:
    panel: [dataset]
  categorical_reps:
    panel: dataset
  control_values_dict:
    panel: old panel
  lin_from_state: true    # the shared markers
  quad_from_state: true   # each panel's own markers
  use_linear: true

datamodule:
  n_train_steps: 100
  batch_size: 256

module:
  time_features_id: ott-jax
  num_time_features: 256
  state_encoder_output_dim: 16
  time_encoder_output_dim: 16
  state_encoder_mlp_kwargs: {hidden_dims: [32], activation_cls: silu}
  time_encoder_mlp_kwargs: {hidden_dims: [32], activation_cls: silu}
  vf_decoder_mlp_kwargs: {hidden_dims: [64, 64], activation_cls: silu}
  conditioning_id: resnet1d
  condition_encoder_output_dim: 32
  condition_encoder_pooling_mode: mean
  condition_encoder_pooling_proj_dim: 32
  condition_encoder_output_layers_kwargs: {hidden_dims: [32], activation_cls: silu}
  source_encoder_mlp_kwargs: {hidden_dims: [32], activation_cls: silu}   # fused GW: the flow reads the source
  source_encoder_output_dim: 16

training:
  generate_from_noise: true

probability_path:
  name: linear_dirac

coupling:
  method: fused
  scale_cost: median
  epsilon: 1.0
  max_iter: 100
  tol: 1.0e-5
  alpha: 0.5
  inner_stop_thr: 1.0e-4   # #202 used POT's defaults (1e-9 inside, 1e-9 / 1000 outside): ~1 min per training step

inference:
  generate_from_noise: true
  solver_kwargs: {method: euler}
  n_steps: 10
  n_samples: 100

optimizer:
  name: AdamW
  kwargs: {lr: 1.0e-4}

metrics:
  mmd:
    gammas: null

callbacks:
  early_stopping:
    monitor: val/edist
  model_checkpoint:
    monitor: val/edist

trainer:
  accelerator: cuda

run:
  method_seed: 0
  allow_overwrite: true

loggers:
  wandb:
    project: sckitflow
    name: flow-cyto-panel-alignment
  csv:
    name: flow-cyto-panel-alignment
