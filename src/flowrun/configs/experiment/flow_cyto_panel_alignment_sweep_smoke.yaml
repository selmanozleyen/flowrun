# @package _global_
# One trial of the fused flow_cyto_panel_alignment sweep, small, to check the Optuna + submitit wiring before a real launch:
#   flowrun-fit-cfm -m +experiment=flow_cyto_panel_alignment_sweep_smoke
defaults:
  - flow_cyto_panel_alignment_sweep_fused

sweep_name: flow_cyto_panel_alignment_sweep_smoke

hydra:
  sweep:
    dir: ${oc.env:FLOWRUN_SWEEP_DIR,multirun}/${sweep_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: trial_${hydra.job.num}
  sweeper:
    n_trials: 1
    n_jobs: 1

datamodule:
  n_train_steps: 20
inference:
  n_steps: 3
  n_samples: 8
trainer:
  max_epochs: 1
run:
  allow_overwrite: true
