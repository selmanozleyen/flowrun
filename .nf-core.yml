repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - assets/sendmail_template.txt
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-flowrun_logo_light.png
    - docs/images/nf-core-flowrun_logo_light.png
    - docs/images/nf-core-flowrun_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CITATIONS.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-flowrun_logo_light.png
    - docs/images/nf-core-flowrun_logo_light.png
    - docs/images/nf-core-flowrun_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: selmanozleyen
  name: flowrun
  description: Train flow-matching models on single-cell perturbation data, from reusable
    steps
  author: Selman Ozleyen
  version: 0.1.0dev
  force: true
  outdir: /Users/selman/projects/flowrun
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - codespaces
    - rocrate
    - email
    - citations
    - github_badges
  is_nfcore: false
